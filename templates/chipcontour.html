<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChipContour · 树脂断片台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='chipcontour.css') }}">
  <script defer src="{{ url_for('static', filename='chipcontour.js') }}"></script>
</head>
<body>
<header class="masthead">
  <a class="brand" href="/"><i aria-hidden="true"></i> ChipContour</a>
  <span class="mast-label">树脂断片台</span>
  <a class="external" href="/prepare">照片准备 ↗</a>
</header>
<main>
  <section class="introduction">
    <div><h1>树脂断片外边测量</h1><p>用断片原照实测每个原行的断边和距观察框的距离。</p></div>
    <div class="top-actions">
      <button id="practice" class="primary" type="button">打开练习断片</button>
      <button id="open-import" type="button">导入原片</button>
    </div>
  </section>
  <p id="notice" class="notice" role="status" hidden></p>
  <section class="library">
    <label for="library">断片卡</label>
    <select id="library"><option value="">选取已存卡片</option></select>
    <span id="origin"></span>
  </section>
  <section id="empty" class="empty">
    <div class="chip-icon" aria-hidden="true"><i></i></div>
    <h2>选择一张断片原照</h2>
    <p>在暗色台面正拍断片，把测量框对应一侧置于断片外。</p>
  </section>
  <section id="workspace" class="workspace" hidden>
    <div class="left">
      <section class="panel source">
        <div class="panel-head">
          <div><h2 id="card-title">原片</h2><span id="dimensions"></span></div>
          <div class="modes" role="group" aria-label="原照取样">
            <button id="probe-mode" data-mode="probe" aria-pressed="true" type="button">点读</button>
            <button id="mark-mode" data-mode="mark" aria-pressed="false" type="button">取截线</button>
          </div>
        </div>
        <div class="camera"><canvas id="capture" aria-label="断片原照，可点击取样或输入原片像素坐标"></canvas></div>
        <div class="probe">
          <b>原片点读</b>
          <form id="probe-form"><label>X <input id="probe-x" type="number" min="0" step="1" required></label>
            <label>Y <input id="probe-y" type="number" min="0" step="1" required></label>
            <button type="submit">读取</button></form>
          <span id="probe-result">选择原片像素</span>
        </div>
      </section>
      <section class="panel profile">
        <div class="panel-head">
          <div><h2 id="chart-title">原行实测亮度</h2><span id="chart-caption">当前截线 · 原片 X</span></div>
          <div class="modes" role="group" aria-label="当前图表">
            <button data-chart="profile" aria-pressed="true" type="button">原行剖面</button>
            <button data-chart="coverage" aria-pressed="false" type="button">断边走势</button>
          </div>
        </div>
        <canvas id="chart" width="850" height="166" aria-label="原行亮度及外边走势"></canvas>
      </section>
    </div>
    <aside class="right">
      <section class="panel readout">
        <div class="panel-head"><h2>当前断边距离</h2><span id="measurement-state"></span></div>
        <div class="edge"><strong id="edge-value">—</strong><span id="edge-unit"></span></div>
        <p id="selected-level"></p>
        <p id="body-state"></p>
      </section>
      <form id="calibration" class="panel settings">
        <div class="panel-head"><div><h2>测量框和标尺</h2><span>坐标使用原片像素，X 向右，Y 向下</span></div></div>
        <label class="wide">卡片名称<input id="name" maxlength="80" required></label>
        <fieldset><legend>原片测量框 · px</legend><div class="form-grid">
          <label>左界 X<input data-setting="left" type="number" step="1" min="0" required></label>
          <label>右界 X<input data-setting="right" type="number" step="1" min="0" required></label>
          <label>截线 Y<input data-setting="focus" type="number" step="1" min="0" required></label>
          <label>上界 Y<input data-setting="top" type="number" step="1" min="0" required></label>
          <label>下界 Y<input data-setting="bottom" type="number" step="1" min="0" required></label>
        </div></fieldset>
        <fieldset><legend>断边方向与标尺</legend><div class="form-grid">
          <label>进入方向<select data-setting="side"><option value="left">从左向右</option><option value="right">从右向左</option></select></label>
          <label>亮度下限<input data-setting="cutoff" type="number" step="1" min="1" max="254" required></label>
          <label>标尺 mm/px<input data-setting="mm_per_px" type="number" step="any" min="0.001" required></label>
        </div></fieldset>
        <button id="save" class="primary" type="submit">保存并测量</button>
      </form>
      <section class="panel outputs">
        <div class="panel-head"><h2>断片交接</h2></div>
        <div><a id="proof" download>PNG 校样 ↓</a><a id="csv" download>CSV 读数 ↓</a><a id="zip" download>ZIP 断片卡 ↓</a></div>
        <button id="prepare" type="button">将原片送入照片准备 ↗</button>
      </section>
    </aside>
  </section>
</main>
<dialog id="import">
  <form id="upload">
    <h2>导入断片原照</h2>
    <label>断片卡名称<input name="name" maxlength="80" required></label>
    <label>照片<input name="photo" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff" required></label>
    <p id="import-notice" role="status"></p>
    <div class="top-actions"><button id="cancel-import" type="button">取消</button><button class="primary" type="submit">建立断片卡</button></div>
  </form>
</dialog>
</body>
</html>
